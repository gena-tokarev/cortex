name: focoris

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  auth-api:
    image: ${AUTH_API_IMAGE:?AUTH_API_IMAGE is required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET}
      AUTH_REFRESH_TOKEN_SECRET: ${AUTH_REFRESH_TOKEN_SECRET}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS}
      AUTH_REFRESH_TOKEN_TTL_SECONDS: ${AUTH_REFRESH_TOKEN_TTL_SECONDS}
      AUTH_COOKIE_ACCESS_TOKEN_NAME: ${AUTH_COOKIE_ACCESS_TOKEN_NAME:-focoris_access_token}
      AUTH_COOKIE_REFRESH_TOKEN_NAME: ${AUTH_COOKIE_REFRESH_TOKEN_NAME:-focoris_refresh_token}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-lax}
      AUTH_EXTERNAL_AUTH_CODE_TTL_SECONDS: ${AUTH_EXTERNAL_AUTH_CODE_TTL_SECONDS:-300}
      AUTH_EXTERNAL_AUTH_STATE_SECRET: ${AUTH_EXTERNAL_AUTH_STATE_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      GOOGLE_ALLOWED_WEB_REDIRECT_URIS: ${GOOGLE_ALLOWED_WEB_REDIRECT_URIS}
      GOOGLE_ALLOWED_NATIVE_REDIRECT_URIS: ${GOOGLE_ALLOWED_NATIVE_REDIRECT_URIS:-focoris://auth/callback}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID}
      PASSKEY_RP_NAME: ${PASSKEY_RP_NAME}
      PASSKEY_ALLOWED_ORIGINS: ${PASSKEY_ALLOWED_ORIGINS}
    ports:
      - '127.0.0.1:${AUTH_API_PORT:-3001}:3001'
    networks:
      default: {}
      shared_proxy:
        aliases:
          - focoris-auth-api
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:3001/api/health >/dev/null || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    restart: unless-stopped
    depends_on:
      auth-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      AUTH_API_URL: ${AUTH_API_URL}
      WEB_APP_ORIGIN: ${WEB_APP_ORIGIN}
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    networks:
      default: {}
      shared_proxy:
        aliases:
          - focoris-web
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:3000/auth >/dev/null || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres_data:
    external: true
    name: focoris_postgres_data

networks:
  shared_proxy:
    external: true
    name: shared_proxy
