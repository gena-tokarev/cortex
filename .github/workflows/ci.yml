name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  AUTH_API_IMAGE: ghcr.io/gena-tokarev/cortex-auth-api
  WEB_IMAGE: ghcr.io/gena-tokarev/cortex-web

jobs:
  ci:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Lint
        run: bun run lint

      - name: Run unit tests
        run: bun run test

      - name: Build applications
        run: bun run build

      - name: Run end-to-end tests
        run: bun run e2e

  build-auth-api:
    name: Build auth API image
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.AUTH_API_IMAGE }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=development,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=Cortex Auth API
            org.opencontainers.image.description=Cortex authentication API

      - name: Build and optionally publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/auth-api/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=auth-api
          cache-to: type=gha,mode=max,scope=auth-api
          provenance: mode=max
          sbom: true

      - name: Attest published image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.AUTH_API_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  build-web:
    name: Build web image
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=development,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=Cortex Web
            org.opencontainers.image.description=Cortex web application

      - name: Build and optionally publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          provenance: mode=max
          sbom: true

      - name: Attest published image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.WEB_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  promote-development:
    name: Promote development release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-auth-api
      - build-web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: development
      url: https://cortex-dev.podolog-warsaw.pl
    concurrency:
      group: cortex-development-promotion
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check whether this is still main
        id: currency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1

      - name: Decide whether to promote
        id: decision
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -eu
          current_sha=$(git rev-parse HEAD)
          if [ "$current_sha" = "$RELEASE_SHA" ]; then
            echo "promote=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping stale release $RELEASE_SHA; main is $current_sha."
            echo "promote=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create infra repository token
        if: steps.decision.outputs.promote == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: gena-tokarev
          repositories: infra
          permission-contents: write

      - name: Check out infra repository
        if: steps.decision.outputs.promote == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gena-tokarev/infra
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: infra
          persist-credentials: true

      - name: Commit immutable release to infra
        if: steps.decision.outputs.promote == 'true'
        env:
          AUTH_DIGEST: ${{ needs.build-auth-api.outputs.digest }}
          WEB_DIGEST: ${{ needs.build-web.outputs.digest }}
          RELEASE_SHA: ${{ github.sha }}
        working-directory: infra
        run: |
          set -eu
          printf '%s\n' "$AUTH_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          printf '%s\n' "$WEB_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'

          install -d environments/development/cortex
          {
            echo "sourceSha: \"$RELEASE_SHA\""
            echo "authApi:"
            echo "  image:"
            echo "    repository: ghcr.io/gena-tokarev/cortex-auth-api"
            echo "    digest: \"$AUTH_DIGEST\""
            echo "web:"
            echo "  image:"
            echo "    repository: ghcr.io/gena-tokarev/cortex-web"
            echo "    digest: \"$WEB_DIGEST\""
          } > environments/development/cortex/release.yaml

          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "41898282+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add environments/development/cortex/release.yaml
          if git diff --cached --quiet; then
            echo "Infra already contains this release."
            exit 0
          fi
          git commit -m "deploy(cortex): $RELEASE_SHA"

          attempts=0
          until git push origin HEAD:main; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 5 ]; then
              echo "Unable to promote after $attempts attempts." >&2
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
          done
